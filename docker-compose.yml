services:
  # Database
  db:
    image: mariadb:11
    volumes: ['./data/:/var/lib/mysql']
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
    command:
      --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - wpsite
  # phpmyadmin
  phpmyadmin:
    depends_on:
      db:
        condition: service_healthy
    image: phpmyadmin
    restart: "no"
    volumes:
      - './apache-config.conf:/etc/apache2/conf-enabled/servername.conf'
    ports:
      - '${PMA_PORT:-8080}:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      UPLOAD_LIMIT: 512M
    networks:
      - wpsite
  # Wordpress
  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:latest
    ports:
      - '${WP_PORT:-80}:80'
    restart: "no"
    volumes:
      - './www/:/var/www/html'
      - './apache-config.conf:/etc/apache2/conf-enabled/servername.conf'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WP_PREFIX:-dockwp_}
    networks:
      - wpsite
networks:
  wpsite:
